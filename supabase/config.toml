# Managed locally until a hosted project is linked (Phase 2 needs no live
# credentials). Apply with the Supabase CLI once configured:
#
#   supabase link --project-ref <ref>   # requires access token, Phase 2+
#   supabase db push                     # applies supabase/migrations/*.sql
#   psql <seed> or supabase db seed      # applies supabase/seed.sql
#
# RLS + storage policies ship in migrations 0002/0003 and are verified by
# review in Phase 2 (no live project yet). Never commit service-role keys.

[project]
name = "annadata-mitra"

# Edge Functions (server-side secrets live in function env, set via
# `supabase secrets set` or the dashboard — never in this repo):
#   ai-chat:         GEMINI_API_KEY (+ SUPABASE_URL/ANON_KEY/SERVICE_ROLE_KEY)
#   scan-crop:       GEMINI_API_KEY (+ SUPABASE_URL/ANON_KEY/SERVICE_ROLE_KEY)
#   admin-overview:  ADMIN_EMAILS (+ SUPABASE_URL/ANON_KEY/SERVICE_ROLE_KEY)
# Deploy: supabase functions deploy ai-chat scan-crop admin-overview
# (needs a CLI access token). JWT verification stays enabled.
[functions.ai-chat]
enabled = true
verify_jwt = true

[functions.scan-crop]
enabled = true
verify_jwt = true

[functions.admin-overview]
enabled = true
verify_jwt = true
