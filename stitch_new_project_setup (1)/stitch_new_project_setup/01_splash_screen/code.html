ry-container": "#747474", "surface-dim": "#dbdad9" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-lg": "1.5rem", "space-md": "1rem", "gutter": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "margin": "2rem", "space-xl": "2.5rem" }, fontFamily: { "headline-lg": ["Anton"], "body-md": ["Poiret One"], "label-md": ["Bebas Neue"] }, fontSize: { "headline-lg": ["3rem", { "lineHeight": "1.1", "fontWeight": "400" }], "body-md": ["1rem", { "lineHeight": "1.5", "fontWeight": "400" }], "label-md": ["0.875rem", { "lineHeight": "1.2", "fontWeight": "400" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full relative overflow-hidden py-10 px-margin items-center justify-between min-h-[85vh]">
<!-- Ambient Emerald Glow Layers -->
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-72 h-72 bg-surface-dim/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top Status/Context Indicator -->
<div class="w-full flex items-center justify-between z-10 opacity-75">
<div class="flex items-center gap-space-xs">
<span class="inline-block w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Core Engine Active</span>
</div>
<div class="bg-surface-container-high px-3 py-1 rounded-full">
<span class="font-label-md text-label-md text-secondary">Neural Farm OS</span>
</div>
</div>
<!-- Central Brand Presentation -->
<div class="flex flex-col items-center justify-center my-auto z-10 w-full max-w-xs text-center">
<!-- Emblem Housing with Subtle Tonal Depth -->
<div class="relative mb-space-lg flex items-center justify-center">
<div class="absolute inset-0 bg-surface-container-highest rounded-full blur-lg opacity-40 scale-110"></div>
<div class="relative w-36 h-36 bg-surface-container-lowest rounded-full p-4 flex items-center justify-center shadow-xl">
<img alt="Annadata Mitra Official Brandmark" class="w-full h-full object-contain filter drop-shadow-sm select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD31XHjUITn2dJgjo-FGgI23Ba31DVdF0HQ6cwLGPoUrcczAnE5lCs8AfW3xXYlkrUq_E4T32-pxEY-xj77oSTs6Nqi-Lh0N2NpCGV0m3ksn_6DG3H20Iz6eQovIQ1mfGkllAfA3CRK1oWQmQ09hBfMUsrfgIEAetR8q6kNhrkaibgUwcgb2yq6PXfLlwTJbMQJF31_MV6GNJVkLfjOL9cLA9oblvf6IxgShVqiGLEGy3PutQ_PPCM4rNct8s44T_tkCA"/>
</div>
</div>
<!-- Minimalist Typographic Hierarchy -->
<h1 class="font-headline-lg text-headline-lg tracking-wider text-on-surface uppercase mb-space-xs">
      Annadata Mitra
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant tracking-widest uppercase text-xs">
      AI Farming Intelligence System
    </p>
<!-- Micro Spec Pillars -->
<div class="grid grid-cols-3 gap-space-xs w-full mt-space-lg pt-space-md">
<div class="flex flex-col items-center bg-surface-container-low py-2 px-1 rounded-lg">
<span class="font-label-md text-label-md text-secondary tracking-wider">PRECISION</span>
<span class="font-body-md text-body-md text-on-surface text-xs font-semibold">99.4%</span>
</div>
<div class="flex flex-col items-center bg-surface-container-low py-2 px-1 rounded-lg">
<span class="font-label-md text-label-md text-secondary tracking-wider">TELEMETRY</span>
<span class="font-body-md text-body-md text-on-surface text-xs font-semibold">Real-Time</span>
</div>
<div class="flex flex-col items-center bg-surface-container-low py-2 px-1 rounded-lg">
<span class="font-label-md text-label-md text-secondary tracking-wider">SYNC</span>
<span class="font-body-md text-body-md text-on-surface text-xs font-semibold">Global</span>
</div>
</div>
</div>
<!-- Bottom Loading & Telemetry Status -->
<div class="w-full max-w-xs flex flex-col items-center gap-space-sm z-10">
<!-- Shimmer Bar -->
<div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden relative">
<div class="h-full bg-primary rounded-full transition-all duration-300 w-1/4" id="progress-indicator"></div>
</div>
<div class="w-full flex items-center justify-between text-on-surface-variant px-1">
<span class="font-label-md text-label-md uppercase tracking-wider text-xs" id="loading-stage">Initializing Neural Links...</span>
<span class="font-label-md text-label-md text-xs tracking-wider">v2.4 Production</span>
</div>
</div>
</div>
<script>
  (function() {
    const progressBar = document.getElementById('progress-indicator');
    const loadingStage = document.getElementById('loading-stage');
    
    const stages = [
      { width: '28%', text: 'Calibrating Sensors...' },
      { width: '56%', text: 'Connecting Satellite Mesh...' },
      { width: '84%', text: 'Synthesizing Soil Models...' },
      { width: '100%', text: 'System Ready' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < stages.length) {
        if (progressBar) progressBar.style.width = stages[currentStep].width;
        if (loadingStage) loadingStage.textContent = stages[currentStep].text;
        currentStep++;
      } else {
        clearInterval(interval);
      }
    }, 700);
  })();
</script></main></body></html>
